spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devstreak}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
server:
  port: 8080
